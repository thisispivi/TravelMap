server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/security-headers.conf;

  # The image's own nginx.conf leaves compression off. The bundles and the
  # dataset JSON shrink to about a quarter, which is most of a first load.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types application/javascript application/json application/x-protobuf image/svg+xml text/css text/plain;

  # Vite names every build asset after its content, so a file under assets/
  # never changes and can be kept for a year. The security headers are
  # included again because a location's add_header replaces the inherited
  # set.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/security-headers.conf;
  }

  # A location block replaces the inherited add_header set, so the media
  # policy is restated here rather than inherited. It is deliberately stricter:
  # anything under media/ is an asset, and an SVG someone drops in there must
  # stay inert if a visitor navigates straight to it.
  location /media/ {
    alias /srv/media/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
