name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          cache: pnpm
          node-version: 22.22.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/uploader/requirements.txt
      - run: python -m pip install -r scripts/uploader/requirements.txt
      - run: python -m compileall -q scripts/uploader
      - run: python -m unittest discover -s scripts/uploader -p 'test_*.py'
      - run: pnpm --filter travel-map security:audit
