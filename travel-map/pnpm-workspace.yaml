allowBuilds:
  "@parcel/watcher": true
  msgpackr-extract: true

ignoredBuiltDependencies:
  - esbuild

blockExoticSubdeps: true

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - brace-expansion@5.0.9
  - fast-uri@3.1.5
  - react-router@8.3.0

onlyBuiltDependencies:
  - "@parcel/watcher"

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1

overrides:
  # Legacy consumers do not all request the patched security releases yet.
  brace-expansion: 5.0.9
  fast-uri: 3.1.5
  postcss: 8.5.25
