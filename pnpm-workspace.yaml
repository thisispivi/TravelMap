allowBuilds:
  "@parcel/watcher": true
  msgpackr-extract: true

ignoredBuiltDependencies:
  - esbuild

blockExoticSubdeps: true

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - brace-expansion@5.0.8
  - react-router@8.3.0

onlyBuiltDependencies:
  - "@parcel/watcher"

packages:
  - "apps/*"
  - "packages/*"

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1

overrides:
  # Legacy minimatch consumers have no patched brace-expansion major.
  brace-expansion: 5.0.8
