allowBuilds:
  "@parcel/watcher": true
  msgpackr-extract: true

ignoredBuiltDependencies:
  - esbuild

blockExoticSubdeps: true

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - react-router@8.3.0
  - js-yaml@4.3.1
  - nanoid@3.3.17 || 3.3.18
  - source-map-js@1.2.2

onlyBuiltDependencies:
  - "@parcel/watcher"

peerDependencyRules:
  allowedVersions:
    "eslint-plugin-react>eslint": "10"

packages:
  - "apps/*"
  - "packages/*"

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1

overrides:
  # Legacy consumers do not all request the patched security releases yet.
  brace-expansion: 5.0.12
  browserslist: 4.28.8
  fast-uri: 3.1.8
  postcss: 8.5.26
  smol-toml: 1.9.0
  source-map-js: 1.2.2
  # Keep the last trusted-publisher release until newer fastq releases regain provenance.
  fastq: 1.20.1

auditConfig:
  ignoreGhsas:
    # braces stack exhaustion on deeply nested glob patterns. Reached only
    # through dev tooling (gh-pages, react-doctor) that expands patterns this
    # repository writes itself, and no fixed release exists yet (3.0.3 is the
    # latest). Drop this entry once braces publishes the patched version.
    - GHSA-vfj7-8cjw-p6xm
