packages:
  - "apps/*"
  - "packages/*"

# Supply chain: only install versions published at least a day ago, refuse
# git/tarball sub-dependencies, and refuse versions with weaker provenance than
# an earlier one. A day, not longer, so Dependabot security fixes (opened as
# soon as a fix ships) pass CI on the next run. Dependabot's own version
# updates wait three days (cooldown in .github/dependabot.yml).
minimumReleaseAge: 1440
blockExoticSubdeps: true
trustPolicy: no-downgrade

# Packages whose install scripts may run (true) or are skipped (false).
allowBuilds:
  "@parcel/watcher": true
  "esbuild": false
  "msgpackr-extract": true

# eslint-plugin-react still declares an ESLint peer below 10; it works with 10.
peerDependencyRules:
  allowedVersions:
    "eslint-plugin-react>eslint": "10"
# semver 6.3.1 lost provenance in a republish; the code is unchanged.
trustPolicyExclude:
  - semver@6.3.1

overrides:
  # Security floor for ESLint's minimatch (dev tooling). It applies only to the
  # vulnerable range; drop it once no consumer asks for one.
  "minimatch@>=7 <11.0.1": ^11.0.1

auditConfig:
  ignoreGhsas:
    # picomatch ReDoS on repeated extglobs: every release up to 4.0.7 is affected
    # and no fix exists yet. It is reached only through build and lint tooling
    # that matches glob patterns this repository writes itself. Drop this entry
    # once picomatch publishes a patched release.
    - GHSA-fc5q-39xc-vjpf
